version: "3.8"
services:
  mlflow:
    image: python:3.10-slim
    container_name: mlflow
    working_dir: /app
    volumes:
      - ./mlruns:/app/mlruns
      - ./mlflow_db:/app/mlflow_db
    ports:
      - "5001:5001"
    command: /bin/sh -c "python -m pip install --no-cache-dir mlflow && mlflow server --backend-store-uri sqlite:///mlflow_db/mlflow.db --default-artifact-root ./mlruns --host 0.0.0.0 --port 5001"

  trainer:
    build:
      context: ..
      dockerfile: Structured_data_template/train/Dockerfile
    container_name: trainer
    volumes:
      - ..:/project
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5001
    depends_on:
      - mlflow
    command: /bin/sh -c "python Structured_data_template/train/scripts/train.py --config Structured_data_template/train/config/run_config.cfg"
